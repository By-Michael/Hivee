server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # The JS bundle is ~1.8MB uncompressed (see the vite build warning) and
    # was being served as-is — gzip cuts that (and the JSON API responses
    # this proxies to, if used as a reverse proxy) by roughly 70-80%, which
    # is most of what's felt as "the app is slow to open" before any data
    # has even loaded yet.
    gzip on;
    gzip_comp_level 6;
    gzip_min_length 512;
    gzip_types text/plain text/css application/json application/javascript
        text/javascript application/xml text/xml image/svg+xml;
    gzip_vary on;

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Hashed asset filenames (index-XXXX.js/css) never change content once
    # built, so they can be cached aggressively — avoids re-downloading the
    # whole bundle on every repeat visit.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
