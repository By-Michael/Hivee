version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: cfms_user
      POSTGRES_PASSWORD: cfms_password
      POSTGRES_DB: cfms_db
    ports:
      - "5432:5432"
    volumes:
      - cfms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cfms_user -d cfms_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./cfms-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://cfms_user:cfms_password@postgres:5432/cfms_db
      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - cfms_uploads:/app/uploads

  frontend:
    build:
      context: ./cfms-frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  cfms_pgdata:
  cfms_uploads:
