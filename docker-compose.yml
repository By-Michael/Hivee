version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: hivee_user
      POSTGRES_PASSWORD: hivee_password
      POSTGRES_DB: hivee_db
    ports:
      - "5432:5432"
    volumes:
      - hivee_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hivee_user -d hivee_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./hivee-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://hivee_user:hivee_password@postgres:5432/hivee_db
      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - hivee_uploads:/app/uploads

  frontend:
    build:
      context: ./hivee-frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  hivee_pgdata:
  hivee_uploads:
