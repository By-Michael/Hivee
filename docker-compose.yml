version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: oudaa_user
      POSTGRES_PASSWORD: oudaa_password
      POSTGRES_DB: oudaa_db
    ports:
      - "5432:5432"
    volumes:
      - oudaa_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U oudaa_user -d oudaa_db"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./oudaa-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 4000
      DATABASE_URL: postgresql://oudaa_user:oudaa_password@postgres:5432/oudaa_db
      JWT_ACCESS_SECRET: change_me_access_secret
      JWT_REFRESH_SECRET: change_me_refresh_secret
      JWT_ACCESS_EXPIRES_IN: 15m
      JWT_REFRESH_EXPIRES_IN: 7d
      CORS_ORIGIN: http://localhost:5173
    ports:
      - "4000:4000"
    volumes:
      - oudaa_uploads:/app/uploads

  frontend:
    build:
      context: ./oudaa-frontend
      args:
        VITE_API_URL: http://localhost:4000/api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "5173:80"

volumes:
  oudaa_pgdata:
  oudaa_uploads:
